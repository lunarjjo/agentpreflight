name: Release

# Builds and attaches verified artifacts to a GitHub release when a v* tag
# is pushed. PyPI publication is prepared but intentionally NOT enabled:
# it requires the maintainer to configure trusted publishing first
# (see docs/releasing.md).

on:
  push:
    tags: ["v*"]

permissions:
  contents: write  # required to create the GitHub release

jobs:
  build:
    name: Build and verify artifacts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade build twine
          python -m build
          python -m twine check dist/*
      - name: Verify wheel installs in a clean venv
        run: |
          python -m venv /tmp/fresh
          /tmp/fresh/bin/python -m pip install dist/*.whl
          /tmp/fresh/bin/agentpreflight version
          /tmp/fresh/bin/agentpreflight doctor
      - name: Generate checksums
        run: cd dist && sha256sum * > SHA256SUMS.txt
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-dist
          path: |
            dist/*
            dist/SHA256SUMS.txt

  github-release:
    name: Attach artifacts to GitHub release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-dist
          path: dist
      - name: Create release with artifacts
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          gh release create "$TAG" dist/* \
            --title "AgentPreflight $TAG" \
            --notes "See [CHANGELOG.md](https://github.com/lunarjjo/agentpreflight/blob/main/CHANGELOG.md) for details. Verify artifacts against dist/SHA256SUMS.txt."
        env:
          GH_TOKEN: ${{ github.token }}

  # PyPI publication is deliberately not wired up yet.
  # Steps to enable (maintainer):
  #   1. Create a PyPI project + trusted publisher for this repo
  #      (OIDC, no API token needed):
  #      https://docs.pypi.org/trusted-publishers/creating-a-project/
  #   2. Uncomment the job below.
  # pypi:
  #   name: Publish to PyPI
  #   needs: build
  #   runs-on: ubuntu-latest
  #   environment: pypi
  #   permissions:
  #     id-token: write  # OIDC for trusted publishing
  #   steps:
  #     - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
  #       with:
  #         name: release-dist
  #         path: dist
  #     - uses: pypa/gh-action-pypi-publish@<pin-to-release-commit-sha>
